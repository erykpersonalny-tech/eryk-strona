<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nie znaleziono strony | Eryk Jóskowski</title>
<style>
  :root { --neon-green: #00ff88; --black: #0a0a0a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--black); color: #fff;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  .box { max-width: 520px; }
  .code { font-size: 72px; font-weight: 900; color: var(--neon-green); line-height: 1; }
  h1 { font-size: 26px; margin: 16px 0 12px; }
  p { color: #bbb; line-height: 1.6; margin-bottom: 28px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a { display: inline-block; padding: 14px 24px; border-radius: 8px; font-weight: 700; text-decoration: none; }
  .primary { background: var(--neon-green); color: var(--black); }
  .ghost { border: 2px solid var(--neon-green); color: var(--neon-green); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Tej strony nie ma</h1>
    <p>Link mógł się zmienić albo materiał został przeniesiony. Jeśli szukasz planu „Pierwsze 4 tygodnie na siłowni”, znajdziesz go niżej.</p>
    <div class="btns">
      <a class="primary" href="/4-tygodnie/">Darmowy plan na start</a>
      <a class="ghost" href="/">Strona główna</a>
    </div>
  </div>
</body>
</html>
