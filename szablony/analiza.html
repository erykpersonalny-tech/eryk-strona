<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Analiza dzienniczka</title>
<link rel="stylesheet" href="fonts/roboto/400.css"><link rel="stylesheet" href="fonts/roboto/500.css"><link rel="stylesheet" href="fonts/roboto/700.css"><link rel="stylesheet" href="fonts/roboto/900.css">
<!--
  Szablon „Analiza dzienniczka” – Eryk Jóskowski.
  Dane wstrzykuje render.js (window.DATA). Przykład: analiza.przyklad.json.
  Tekst: <b>…</b> = pogrubienie. Nawyk może mieć opcjonalne "why" (domyślnie Eryk go NIE chce).
-->
<style>
@page { size: A4; margin: 14mm 12mm 16mm; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; font-family: Roboto, Arial, sans-serif; color: #1c1c1c; font-size: 10pt; line-height: 1.45; }
b { font-weight: 700; }
.hero { background: radial-gradient(circle at 85% 70%, #0d5a35 0%, #07291a 35%, #050505 75%); color: #fff; padding: 22px 22px 20px; }
.kick { display: flex; align-items: center; gap: 8px; color: #19e07f; font-size: 6.8pt; letter-spacing: 3px; font-weight: 700; }
.kick:before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: #19e07f; }
.hero h1 { margin: 8px 0 8px; font-weight: 900; font-size: 25pt; letter-spacing: -0.3px; line-height: 1; }
.hero h1 span { color: #b9f5d5; }
.hero p { margin: 0; font-size: 9pt; color: #e8e8e8; max-width: 92%; }
.title { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2.5px solid #111; padding: 14px 4px 6px; margin-bottom: 14px; }
.title h2 { margin: 0; font-size: 13pt; font-weight: 700; text-transform: uppercase; }
.title span { font-size: 8pt; color: #555; }
.card { border: 1px solid #e3e3e3; border-radius: 10px; margin-bottom: 12px; break-inside: avoid; overflow: hidden; }
.bar { background: #0b0b0b; color: #fff; padding: 8px 12px; font-size: 8pt; font-weight: 700; display: flex; justify-content: space-between; letter-spacing: 0.3px; text-transform: uppercase; }
.bar em { font-style: normal; color: #19e07f; }
.inner { padding: 12px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { border: 1px solid #e3e3e3; border-radius: 8px; padding: 9px 10px; }
.stat .l { font-size: 6.3pt; letter-spacing: 2px; color: #0aa85b; font-weight: 700; text-transform: uppercase; }
.stat .v { font-size: 16pt; font-weight: 900; margin: 2px 0 2px; }
.stat .v small { font-size: 7.5pt; font-weight: 700; }
.stat .v.bad { color: #d4500f; }
.stat .d { font-size: 7.2pt; color: #666; line-height: 1.35; }
.note { font-size: 6.8pt; color: #888; margin-top: 8px; }
.good { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; padding: 14px 18px; }
.good div { font-size: 8.6pt; padding-left: 9px; position: relative; }
.good div:before { content: "•"; color: #0aa85b; position: absolute; left: 0; }
.habit-head { display: flex; align-items: center; gap: 12px; background: #f4f5f4; padding: 10px 12px; }
.num { width: 22px; height: 22px; border-radius: 5px; background: #0b0b0b; color: #19e07f; font-weight: 700; font-size: 9.5pt; display: flex; align-items: center; justify-content: center; flex: none; }
.habit-head h3 { margin: 0; font-size: 10pt; font-weight: 700; flex: 1; }
.pill { font-size: 6.3pt; letter-spacing: 2px; color: #0aa85b; border: 1px solid #8fe3b8; border-radius: 99px; padding: 2px 9px; font-weight: 700; }
.cols { display: grid; grid-template-columns: 1fr; padding: 10px 12px 12px 24px; }
.cols.two { grid-template-columns: 1fr 1fr; padding-left: 12px; }
.cols.two > div:first-child { padding-right: 12px; border-right: 1px solid #e3e3e3; }
.cols.two > div:last-child { padding-left: 12px; }
.cols .l { font-size: 6.3pt; letter-spacing: 2px; color: #0aa85b; font-weight: 700; margin-bottom: 3px; }
.cols p { margin: 0 0 5px; font-size: 8.6pt; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { border: 1px solid #e3e3e3; border-radius: 8px; padding: 8px 10px; }
.tile b { font-size: 8.4pt; display: block; }
.tile .g { color: #0aa85b; font-weight: 900; font-size: 12pt; }
.tile .g small { color: #777; font-weight: 400; font-size: 6.8pt; }
.foot { margin-top: 22px; font-size: 6.5pt; letter-spacing: 2.5px; color: #999; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.DATA = /*DATA*/null;
(function () {
  const D = window.DATA;
  if (!D) { document.getElementById('root').textContent = 'Brak danych (uruchom przez render.js).'; window.__ready = true; return; }
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');
  const paras = x => (Array.isArray(x) ? x : [x]).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
  const habits = D.habits || [];
  let h = `
  <div class="hero"><div class="kick">ERYK JÓSKOWSKI · TRENER PERSONALNY</div>
    <h1>ANALIZA DZIENNI<span>CZKA</span></h1>
    <p>${esc(D.intro || 'Podsumowanie 7 dni Twojego jedzenia i plan kilku prostych zmian. Bez diety cud, bez zakazów – małe nawyki, które robią największą różnicę.')}</p></div>
  <div class="title"><h2>Plan zmian – ${esc(D.name)}</h2><span>na podstawie dzienniczka ${esc(D.period)}</span></div>
  <div class="card"><div class="bar">Twój tydzień w liczbach</div><div class="inner">
    <div class="stats">${(D.stats||[]).map(s => `<div class="stat"><div class="l">${esc(s.label)}</div>
      <div class="v${s.bad ? ' bad' : ''}">${esc(s.value)} <small>${esc(s.unit)}</small></div>${s.desc ? `<div class="d">${esc(s.desc)}</div>` : ''}</div>`).join('')}</div>
    <div class="note">${esc(D.stats_note || 'Porcje opisane bez gramatur – liczby traktuj jako orientacyjny kierunek, nie dokładny wynik.')}</div></div></div>
  <div class="card"><div class="bar">Co już robisz dobrze <em>ZOSTAWIAMY</em></div>
    <div class="good">${(D.good||[]).map(g => `<div>${esc(g)}</div>`).join('')}</div></div>
  <div class="title" style="margin-top:6px"><h2>${esc(D.habits_title || ('Twoje ' + habits.length + ' nawyki na start'))}</h2><span>w kolejności ważności</span></div>`;
  habits.forEach((x, i) => {
    const two = x.why && x.why.length;
    h += `<div class="card"><div class="habit-head"><div class="num">${i+1}</div><h3>${esc(x.title)}</h3>${i === 0 ? '<span class="pill">PRIORYTET</span>' : ''}</div>`;
    if (x.todo && x.todo.length) h += `<div class="cols${two ? ' two' : ''}"><div><div class="l">CO ROBIĆ</div>${paras(x.todo)}</div>${two ? `<div><div class="l">DLACZEGO</div>${paras(x.why)}</div>` : ''}</div>`;
    h += `</div>`;
  });
  if (D.snacks && D.snacks.length) {
    h += `<div class="card"><div class="bar">${esc(D.snacks_title || 'Gotowce białkowe na II śniadanie / przekąskę')} <em>~ BIAŁKA</em></div><div class="inner">
      <div class="grid4">${D.snacks.map(s => `<div class="tile"><b>${esc(s.name)}</b><span class="g">${esc(s.protein)} <small>/ ${esc(s.per)}</small></span></div>`).join('')}</div>
      <div class="note">${esc(D.snacks_note || 'Do każdego dorzuć owoc lub garść warzyw. Wartości orientacyjne – sprawdzaj etykietę konkretnego produktu.')}</div></div></div>`;
  }
  h += `<div class="foot"><span>ERYK JÓSKOWSKI · TRENER PERSONALNY · RUMIA</span><span>erykpersonalny.pl</span></div>`;
  document.getElementById('root').innerHTML = h;
  window.__ready = true;
})();
</script>
</body>
</html>
